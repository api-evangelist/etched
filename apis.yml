aid: etched
name: Etched
description: >-
  Etched is an AI hardware company building Sohu, a transformer-only ASIC
  designed to accelerate inference for large language models by hard-wiring
  the transformer architecture directly into silicon. Etched markets Sohu as
  an alternative to general-purpose GPUs for transformer inference, claiming
  order-of-magnitude throughput improvements on models such as Llama 70B
  when deployed in eight-chip server configurations. The chip is fabricated
  on TSMC's 4nm process with 144 GB of HBM3E per package. As of mid-2026
  Etched has raised more than 625 million dollars at a 5 billion dollar
  valuation but has not yet shipped Sohu to customers in volume, and there
  is no public Etched API or developer surface. This profile is
  company-and-product-only and intentionally has an empty apis list.
